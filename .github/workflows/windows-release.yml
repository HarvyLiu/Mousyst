name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Unit tests
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          python -m pytest -q --basetemp build/pytest-ci
      - name: Source UI regression
        run: python src/desktop_app.py --smoke-test
      - name: Build portable desktop keyboard
        run: ./build-preview.ps1 -Desktop -BundleName MousystDesktop
      - name: Verify packaged app
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$PWD/dist/MousystDesktop/MousystDesktop.exe" -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($app.ExitCode -ne 0) { throw "Packaged UI check failed: $($app.ExitCode)" }
          $report = Get-Content build/desktop/smoke.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Packaged regression did not pass.' }
      - name: Prepare download and checksum
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = 'preview'
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Use a semantic version tag, such as v0.2.0.' }
            $version = $env:REF_NAME
          }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $filename = "Mousyst-$version-windows-x64.zip"
          Copy-Item -LiteralPath dist/MousystDesktop-preview-windows-x64.zip -Destination "release/$filename"
          $hash = (Get-FileHash -LiteralPath "release/$filename" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-portable
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-diagnostics
          path: |
            build/desktop/*.json
            build/desktop/*.png
            build/MousystDesktop/warn-*.txt
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: windows-portable
          path: release
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "Mousyst $RELEASE_TAG" --generate-notes
          fi
